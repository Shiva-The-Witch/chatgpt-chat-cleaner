name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
    validations:
      required: true
  - type: input
    id: extension
    attributes:
      label: Extension version
      value: "1.4.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Remove tokens, cookies, account data, and private chat content before posting.
      render: shell
